<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#05061a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Aypona OS 2 : le système d'Aypona City, installable et utilisable hors ligne.">

<title>Aypona OS 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<script>
/* Premier affichage : on applique le miroir des réglages avant tout (pas de flash). */
(function(){ window.__t0 = performance.now(); try{ var m = JSON.parse(localStorage.getItem('aypona-os2:miroir')||'null'); if(!m) return; var d = document.documentElement;
  if(m.texte) d.style.fontSize = m.texte + '%'; if(m.langue) d.lang = m.langue;
  d.className = (m.contraste?' contraste':'') + (m.transparence?' opaque':'') + (m.mouvement?' calme':''); d.dataset.fond = m.fond || 'ville'; }catch(e){} })();
</script>
<style>
/* Aypona OS 2 · Bureau 102 (Polaris). Nuit, verre dépoli, or Aypona, couleurs des 5 studios.
   Unités en rem : la taille du texte (85 à 150 %) agrandit toute l'interface. Zoom autorisé. */
:root{
  color-scheme:dark;
  --ink:#ffffff; --ink-2:rgba(235,235,245,.68); --ink-3:rgba(235,235,245,.42);
  --glass:rgba(30,32,52,.56); --glass-2:rgba(22,24,40,.86); --glass-3:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.13); --panel:#16161c; --panel-2:#1f1f27; --sep:rgba(84,84,96,.55);
  --gold:#d4af37; --gold-soft:#f5d061; --ok:#30d158; --warn:#ff9f0a; --bad:#ff453a; --blue:#0a84ff; --blue-ink:#4da3ff;
  --devea:#ff8a65; --nativus:#4fe0a8; --bronet:#5cb4ff; --pool:#ffc857; --neural:#b392ff;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.32,1.25,.5,1);
  --blur:blur(28px) saturate(160%);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
.contraste{--ink-2:#f2f2f7;--ink-3:#d1d1d6;--glass:rgba(0,0,0,.92);--glass-2:#000;--glass-3:rgba(255,255,255,.16);--line:rgba(255,255,255,.7);--panel:#000;--panel-2:#111;--sep:rgba(255,255,255,.55);--blue-ink:#8cc4ff}
.opaque{--glass:#1b1c2b;--glass-2:#14151f;--blur:none}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05061a;color:var(--ink);font:1rem/1.45 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:.15rem solid var(--gold-soft);outline-offset:.12rem;border-radius:.6rem}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.saut{position:absolute;left:.5rem;top:-3rem;z-index:100;background:#000;padding:.5rem .9rem;border-radius:.6rem}
.saut:focus{top:calc(var(--sat) + .5rem)}

/* ---------- Fonds ---------- */
.fond{position:fixed;inset:-4%;z-index:0}
:root[data-fond="ville"] .os>.fond,.fond[data-f="ville"]{background:radial-gradient(ellipse 80% 40% at 50% 100%,#2a2f7a 0%,transparent 70%),radial-gradient(circle at 78% 14%,rgba(255,236,190,.5) 0 2.2%,transparent 2.8%),radial-gradient(ellipse 50% 30% at 18% 72%,rgba(92,180,255,.35),transparent 70%),radial-gradient(ellipse 45% 25% at 82% 66%,rgba(179,146,255,.3),transparent 70%),radial-gradient(ellipse 40% 22% at 50% 40%,rgba(255,138,101,.16),transparent 70%),linear-gradient(180deg,#05061a 0%,#0b0e26 55%,#1a1a46 100%)}
:root[data-fond="aube"] .os>.fond,.fond[data-f="aube"]{background:radial-gradient(ellipse 60% 50% at 25% 20%,#ff6b9d 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 75% 25%,#ffa06b 0%,transparent 55%),radial-gradient(ellipse 65% 55% at 70% 80%,#5b3fff 0%,transparent 60%),radial-gradient(ellipse 55% 50% at 20% 85%,#00c2ff 0%,transparent 60%),linear-gradient(135deg,#3a1c71,#241440 50%,#1a0b2e)}
:root[data-fond="spatial"] .os>.fond,.fond[data-f="spatial"]{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 48%,#fff,transparent),radial-gradient(1px 1px at 80% 12%,#fff,transparent),radial-gradient(2px 2px at 10% 80%,#fff,transparent),radial-gradient(1px 1px at 62% 24%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 60%,#fff,transparent),radial-gradient(2px 2px at 72% 82%,#fff,transparent),radial-gradient(ellipse at top,#1a1a3e 0%,transparent 60%),radial-gradient(ellipse at bottom right,#2d1b4e 0%,transparent 50%),linear-gradient(180deg,#000010,#0a0520 50%,#000005)}
:root[data-fond="emeraude"] .os>.fond,.fond[data-f="emeraude"]{background:radial-gradient(ellipse 60% 45% at 30% 25%,#1fd1a0 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 75% 75%,#0b6e4f 0%,transparent 65%),radial-gradient(ellipse 40% 35% at 85% 20%,#c8f560 0%,transparent 60%),linear-gradient(160deg,#03251c,#021a14 55%,#010d0a)}
:root[data-fond="or"] .os>.fond,.fond[data-f="or"]{background:radial-gradient(ellipse 70% 45% at 50% 18%,rgba(245,208,97,.55) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 20% 85%,rgba(139,105,20,.6) 0%,transparent 65%),radial-gradient(ellipse 50% 35% at 85% 70%,rgba(212,175,55,.35) 0%,transparent 60%),linear-gradient(170deg,#140f06,#0a0805 55%,#000)}
.contraste .fond{filter:brightness(.45)}

/* ---------- Coquille ---------- */
.os{position:fixed;inset:0;display:flex;flex-direction:column;isolation:isolate}
.barre{position:relative;z-index:30;flex:none;display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:calc(2.9rem + var(--sat));padding:var(--sat) max(.9rem,var(--sar)) 0 max(1.2rem,var(--sal));font-weight:600;font-variant-numeric:tabular-nums}
.scene-on .barre{background:rgba(5,6,18,.92)}
.opaque.scene-on .barre,.contraste .barre{background:#000}
.barre-g{display:flex;align-items:center;gap:.6rem;min-width:0}
.barre-d{display:flex;align-items:center;gap:.15rem}
.heure{font-size:.95rem}
.hors{font-size:.72rem;font-weight:700;padding:.12rem .5rem;border-radius:1rem;background:rgba(255,159,10,.2);color:#ffc266}
.btn-barre{position:relative;display:inline-grid;place-items:center;min-width:max(44px,2.75rem);min-height:max(44px,2.75rem);border-radius:.8rem}
.btn-barre:hover{background:var(--glass-3)}
.btn-barre svg{width:1.25rem;height:1.25rem}
.pastille{position:absolute;top:.3rem;right:.25rem;min-width:1.05rem;height:1.05rem;padding:0 .3rem;border-radius:1rem;background:var(--bad);font-size:.68rem;line-height:1.05rem;text-align:center}
.lune{position:absolute;bottom:.35rem;right:.35rem;width:.55rem;height:.55rem;border-radius:50%;background:#7d7aff}

/* ---------- Accueil ---------- */
.accueil{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:.6rem max(1.1rem,var(--sar)) 1rem max(1.1rem,var(--sal));display:flex;flex-direction:column;gap:1.4rem;scrollbar-width:none}
.accueil::-webkit-scrollbar{display:none}
.accueil > *{width:100%;max-width:62rem;margin-inline:auto}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.widget{border-radius:1.4rem;padding:.9rem 1rem;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--line);min-height:8.4rem;display:flex;flex-direction:column;justify-content:space-between;gap:.4rem;min-width:0;text-align:left;overflow:hidden}
.widget h3{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.w-heure .t{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.w-heure .d{color:var(--ink-2);font-size:.9rem;text-transform:capitalize}
.w-sys .v{font:600 1.3rem/1.1 var(--mono);color:var(--gold-soft)}
.w-liste{list-style:none;display:grid;gap:.2rem;font-size:.8rem;min-width:0}
.w-liste li{display:flex;gap:.4rem;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-gros{font-size:1.9rem;font-weight:700;line-height:1}
.w-btn{align-self:flex-start;padding:.35rem .9rem;border-radius:1rem;background:rgba(255,255,255,.16);font-size:.8rem;font-weight:600;min-height:2.5rem}
.point{width:.45rem;height:.45rem;border-radius:50%;flex:none;background:var(--ok)}
.point.warn{background:var(--warn)}.point.bad{background:var(--bad)}

.grille{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.3rem .5rem;align-content:start}
.tuile{position:relative;display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:0;border-radius:1rem;padding:.25rem 0}
.icone{position:relative;width:min(3.9rem,15vw);aspect-ratio:1;border-radius:22.5%;display:grid;place-items:center;box-shadow:0 .15rem .6rem rgba(0,0,0,.25);color:#fff;font-weight:700;font-size:1.45rem;flex:none;transition:transform .18s var(--ease)}
.icone svg{width:56%;height:56%}
.tuile:active .icone{transform:scale(.92)}
.etiquette{font-size:.75rem;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone .badge{position:absolute;top:-.35rem;right:-.35rem;min-width:1.35rem;height:1.35rem;padding:0 .35rem;border-radius:1rem;background:var(--bad);font-size:.78rem;font-weight:600;display:grid;place-items:center}
.edition .icone{animation:tremble .28s ease-in-out infinite alternate}
.edition .tuile:nth-child(2n) .icone{animation-delay:-.14s}
@keyframes tremble{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.outils-tuile{display:flex;gap:.2rem}
.outils-tuile button{min-width:1.9rem;min-height:1.9rem;border-radius:.6rem;background:rgba(255,255,255,.18);font-size:.8rem;font-weight:700}
.bandeau-edition{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .9rem;border-radius:1rem;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--line);font-size:.88rem}
.vide{margin:1rem auto;max-width:22rem;text-align:center;display:grid;gap:.4rem;padding:1.1rem;border-radius:1.4rem;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--line)}
.vide p{color:var(--ink-2);font-size:.9rem}

.dock-zone{position:relative;z-index:2;flex:none;display:flex;justify-content:center;padding:.3rem max(.8rem,var(--sar)) calc(.6rem + var(--sab)) max(.8rem,var(--sal))}
.dock{display:flex;gap:min(1.3rem,4.5vw);justify-content:center;align-items:center;padding:.7rem 1.1rem;border-radius:1.9rem;min-height:5.2rem;min-width:min(100%,21rem);background:rgba(255,255,255,.16);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid rgba(255,255,255,.22)}
.opaque .dock,.contraste .dock{background:var(--glass-2)}
.dock .etiquette{display:none}
.dock .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:.2rem 0}

/* ---------- Scène et volets (apps ouvertes) ---------- */
.scene{position:absolute;left:0;right:0;bottom:0;top:calc(2.9rem + var(--sat));z-index:20;display:flex;background:#000}
.volet{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:#000}
.volet + .volet{border-left:.5px solid var(--line)}
.volet.actif .volet-barre{box-shadow:inset 0 -2px 0 var(--gold)}
.volet-barre{flex:none;display:flex;align-items:center;gap:.5rem;min-height:3rem;padding:0 max(.5rem,var(--sar)) 0 max(.4rem,var(--sal));background:#0c0c11;border-bottom:.5px solid var(--line)}
.volet-barre .icone{width:1.75rem;border-radius:.45rem;font-size:.8rem;box-shadow:none}
.volet-barre h2{flex:1;min-width:0;font-size:.98rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{display:inline-flex;align-items:center;gap:.25rem;min-height:max(44px,2.75rem);min-width:max(44px,2.75rem);justify-content:center;padding:0 .5rem;border-radius:.7rem;color:var(--blue-ink);font-weight:500}
.vb:hover{background:var(--glass-3)}
.vb svg{width:1.1rem;height:1.1rem}
.volet-corps{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#000;display:flex;flex-direction:column}
.cadre-app{flex:1;width:100%;border:0;background:#fff;display:block;min-height:0}
.separateur{flex:none;width:.9rem;margin:0 -.45rem;z-index:2;cursor:col-resize;display:grid;place-items:center;touch-action:none}
.separateur::after{content:"";width:.3rem;height:3.2rem;border-radius:1rem;background:rgba(255,255,255,.35)}
.separateur:focus-visible::after{background:var(--gold-soft)}
.scene.s33 > .volet:first-child{flex-basis:33%;flex-grow:0}
.scene.s67 > .volet:first-child{flex-basis:67%;flex-grow:0}
.scene.ouvre{animation:monte .32s var(--ease) both}
@keyframes monte{from{opacity:0;transform:translateY(1.2rem) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Vues natives (style Réglages) ---------- */
.vue{padding:.8rem max(1rem,var(--sar)) 2.2rem max(1rem,var(--sal));display:grid;gap:1.4rem;align-content:start;width:100%;max-width:46rem;margin-inline:auto}
.titre-vue{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;padding:.2rem .2rem 0}
.nav-vue{display:flex;align-items:center;gap:.3rem;min-height:2.75rem}
.retour{display:inline-flex;align-items:center;gap:.15rem;color:var(--blue-ink);font-size:1rem;min-height:2.75rem;padding:0 .4rem 0 .1rem;border-radius:.6rem}
.retour svg{width:.75rem;height:1.2rem}
.sec{display:grid;gap:.4rem}
.sec > h3{font-size:.8rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);padding:0 1rem}
.sec > .pied{font-size:.8rem;color:var(--ink-2);padding:0 1rem}
.liste{border-radius:.8rem;background:var(--panel);overflow:hidden;list-style:none}
.ligne{display:flex;align-items:center;gap:.75rem;min-height:2.9rem;padding:.5rem 1rem;width:100%;text-align:left;border-top:.5px solid var(--sep);background:none}
.liste > .ligne:first-child,.liste > li:first-child > .ligne{border-top:0}
.liste > li + li > .ligne{border-top:.5px solid var(--sep)}
button.ligne:hover{background:var(--glass-3)}
.ligne .pi{width:1.8rem;height:1.8rem;border-radius:.45rem;display:grid;place-items:center;flex:none;color:#fff;font-size:.8rem;font-weight:700}
.ligne .pi svg{width:62%;height:62%}
.ligne .pl{flex:1;min-width:0}
.ligne .pl small{display:block;font-size:.8rem;color:var(--ink-2)}
.ligne .pv{color:var(--ink-2);text-align:right;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ligne .chev{width:.5rem;height:.9rem;color:var(--ink-3);flex:none}
.ligne.rouge{color:var(--bad);justify-content:center}
.ligne.bleu{color:var(--blue-ink)}
.ligne select{background:var(--panel-2);border:.5px solid var(--line);border-radius:.55rem;padding:.35rem .5rem;min-height:2.2rem}
.interrupteur{position:relative;width:3.2rem;height:1.95rem;border-radius:1rem;background:#3a3a40;flex:none;transition:background .2s}
.interrupteur::after{content:"";position:absolute;top:.12rem;left:.12rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .22s var(--spring)}
.interrupteur[aria-checked="true"]{background:var(--ok)}
.interrupteur[aria-checked="true"]::after{transform:translateX(1.25rem)}
.contraste .interrupteur{outline:1px solid #fff}
.prose{display:grid;gap:.6rem;padding:.9rem 1rem;border-radius:.8rem;background:var(--panel);font-size:.95rem;color:rgba(255,255,255,.9)}
.prose ul{padding-left:1.1rem;display:grid;gap:.25rem}
.mono{font-family:var(--mono);font-size:.82rem}
.fonds{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4rem,1fr));gap:.8rem;padding:.9rem;border-radius:.8rem;background:var(--panel)}
.fonds button{display:grid;gap:.35rem;justify-items:center;font-size:.78rem;color:var(--ink-2)}
.fonds .ech{width:100%;aspect-ratio:9/16;border-radius:.7rem;position:relative;overflow:hidden;border:2px solid transparent}
.fonds .ech .fond{position:absolute;inset:0}
.fonds button[aria-pressed="true"] .ech{border-color:var(--blue)}
.fonds button[aria-pressed="true"]{color:var(--ink)}
.dom{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;padding:.15rem .55rem;border-radius:1rem;background:rgba(255,255,255,.08);white-space:nowrap}
.dom i{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.legende{display:flex;flex-wrap:wrap;gap:.5rem}
.boutons{display:flex;flex-wrap:wrap;gap:.5rem}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.55rem 1rem;border-radius:.75rem;background:rgba(255,255,255,.12);font-weight:600;min-height:max(44px,2.75rem);text-decoration:none;color:var(--ink)}
.b.bleu{background:var(--blue);color:#fff}
.b.rouge{background:rgba(255,69,58,.18);color:#ff8a82}
.b[disabled]{opacity:.4;cursor:default}
.b.petit{min-height:2.2rem;padding:.3rem .75rem;font-size:.85rem;border-radius:.6rem}
.champ{display:grid;gap:.35rem;padding:.75rem 1rem;border-radius:.8rem;background:var(--panel)}
.champ label{font-size:.82rem;color:var(--ink-2)}
.champ input,.champ textarea,.champ select{width:100%;min-width:0;background:var(--panel-2);border:.5px solid rgba(255,255,255,.12);border-radius:.6rem;color:#fff;padding:.6rem .75rem;outline:none;user-select:text;-webkit-user-select:text}
.champ textarea{min-height:40vh;resize:vertical;line-height:1.5}
.champ textarea.code{min-height:11rem;font:.82rem/1.5 var(--mono)}
.champ input:focus,.champ textarea:focus{border-color:var(--blue)}
.champ input[type=range]{padding:0;background:none;border:0;accent-color:var(--gold)}
.msgs{list-style:none;display:grid;gap:.35rem;font-size:.85rem}
.msgs li{padding:.5rem .75rem;border-radius:.6rem;background:rgba(255,69,58,.14);color:#ffb3ad}
.msgs li.ok{background:rgba(48,209,88,.14);color:#9ff0b5}
.jauge{height:.5rem;border-radius:1rem;background:rgba(255,255,255,.12);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:1rem;background:var(--gold)}
.carte-app{display:grid;grid-template-columns:auto 1fr auto;gap:.15rem .8rem;align-items:center;padding:.8rem 1rem;border-top:.5px solid var(--sep)}
.liste > .carte-app:first-child{border-top:0}
.carte-app .icone{width:2.9rem;border-radius:.7rem;grid-row:span 2;font-size:1.05rem}
.carte-app b{min-width:0}
.carte-app small{grid-column:2;color:var(--ink-2);font-size:.8rem;min-width:0}
.carte-app .act{grid-column:3;grid-row:1 / span 2}
.journal{list-style:none;border-radius:.8rem;background:var(--panel);overflow:hidden}
.journal li{display:grid;grid-template-columns:auto 1fr;gap:.6rem;padding:.45rem .9rem;font-size:.8rem;border-top:.5px solid var(--sep);min-width:0}
.journal li:first-child{border-top:0}
.journal time{font-family:var(--mono);font-size:.75rem;color:var(--ink-3)}
.journal span{min-width:0;overflow-wrap:anywhere}
.test-ok{color:var(--ok)}.test-ko{color:var(--bad)}
.apercu{max-width:100%;border-radius:.8rem;background:#111}
.carte-ext{margin:auto;display:grid;gap:.9rem;justify-items:center;text-align:center;padding:1.8rem 1.4rem;max-width:22rem}
.carte-ext .icone{width:5.4rem;font-size:2rem}
.carte-ext p{color:var(--ink-2);font-size:.9rem}

/* ---------- Feuilles (recherche, notifications, centre de contrôle, apps ouvertes, aide) ---------- */
.feuille{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:rgba(3,4,14,.62);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:var(--sat) 0 var(--sab)}
.opaque .feuille,.contraste .feuille{background:rgba(0,0,0,.93)}
.feuille.entre{animation:descend .3s var(--ease) both}
@keyframes descend{from{opacity:0;transform:translateY(-.8rem)}to{opacity:1;transform:none}}
.feuille-in{flex:1;min-height:0;overflow-y:auto;padding:.7rem max(.9rem,var(--sar)) 1.2rem max(.9rem,var(--sal));display:grid;gap:.8rem;align-content:start;width:100%;max-width:40rem;margin-inline:auto}
.feuille-tete{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem;min-height:2.9rem}
.feuille-tete > .boutons{flex-wrap:nowrap;margin-left:auto}
.feuille-tete h2{font-size:1.6rem;font-weight:700}
.pilule{padding:.4rem .9rem;border-radius:1.4rem;background:rgba(255,255,255,.16);font-size:.88rem;font-weight:600;min-height:max(44px,2.4rem);white-space:nowrap}
.boite-rech{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem;padding:0 .75rem;height:2.9rem;border-radius:.8rem;background:rgba(120,120,135,.32);border:.5px solid var(--line)}
.boite-rech svg{width:1rem;height:1rem;flex:none;opacity:.75}
.boite-rech input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:1.05rem;outline:none}
.boite-rech input::placeholder{color:rgba(255,255,255,.6)}
.groupe-res{display:grid;gap:.35rem}
.groupe-res h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);padding:0 .4rem}
.res{display:flex;align-items:center;gap:.75rem;padding:.5rem .65rem;border-radius:.9rem;width:100%;text-align:left;background:var(--glass)}
.res[aria-selected="true"]{outline:.15rem solid var(--gold-soft)}
.res .icone{width:2.5rem;border-radius:.6rem;font-size:.95rem;box-shadow:none}
.res small{display:block;color:var(--ink-2);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .pl{flex:1;min-width:0}
.res mark{background:none;color:var(--gold-soft);font-weight:700}
.muet{color:var(--ink-2);font-size:.9rem;text-align:center;padding:1.4rem 0}
.notif{display:grid;grid-template-columns:2.3rem 1fr auto;gap:.1rem .65rem;align-items:start;padding:.7rem .85rem;border-radius:1.2rem;background:var(--glass);border:.5px solid var(--line)}
.notif .icone{grid-row:span 2;width:2.3rem;border-radius:.55rem;font-size:.85rem;box-shadow:none}
.notif b{font-size:.88rem;min-width:0}
.notif time{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.notif p{grid-column:2 / 4;font-size:.88rem;color:rgba(255,255,255,.9);min-width:0;overflow-wrap:anywhere}
.notif.nonlue b::before{content:"";display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--blue);margin-right:.35rem;vertical-align:.1rem}
.groupe-notif{display:grid;gap:.4rem}
.groupe-notif > header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:0 .3rem}
.groupe-notif > header b{font-size:.9rem}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.tuile-ctrl{display:flex;align-items:center;gap:.6rem;min-height:4rem;padding:.7rem .85rem;border-radius:1.2rem;background:var(--glass);border:.5px solid var(--line);text-align:left;min-width:0}
.tuile-ctrl .rond{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);flex:none}
.tuile-ctrl .rond svg{width:1.15rem;height:1.15rem}
.tuile-ctrl[aria-pressed="true"] .rond{background:var(--blue)}
.tuile-ctrl[aria-pressed="true"].lune-on .rond{background:#5e5ce6}
.tuile-ctrl span{min-width:0;font-size:.85rem;font-weight:600;line-height:1.2}
.tuile-ctrl small{display:block;font-weight:400;color:var(--ink-2);font-size:.75rem}
.tuile-ctrl.large{grid-column:1 / -1;flex-wrap:wrap}
.cartes-sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.8rem}
.carte-sel{position:relative;display:grid;gap:.5rem;justify-items:center;text-align:center;padding:1.1rem .7rem .9rem;border-radius:1.4rem;background:var(--glass);border:.5px solid var(--line);min-width:0}
.carte-sel .icone{width:3.6rem}
.carte-sel b{font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carte-sel small{color:var(--ink-2);font-size:.75rem}
.carte-sel .x{position:absolute;top:.4rem;right:.4rem;min-width:2.2rem;min-height:2.2rem;border-radius:50%;background:rgba(255,255,255,.16);font-size:1.1rem;line-height:1}
.raccourcis{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;align-items:center;padding:.9rem 1rem;border-radius:.8rem;background:var(--panel)}
kbd{font:600 .78rem var(--mono);padding:.15rem .45rem;border-radius:.35rem;background:rgba(255,255,255,.14);border:.5px solid var(--line);white-space:nowrap}

/* ---------- Dialogue, île, mise à jour, démarrage ---------- */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:1.4rem}
.dlg-carte{width:min(20rem,100%);border-radius:1rem;background:rgba(40,40,48,.97);text-align:center;overflow:hidden;animation:pop .22s var(--spring) both;border:.5px solid var(--line)}
.contraste .dlg-carte{background:#000;border-color:#fff}
@keyframes pop{from{transform:scale(1.1);opacity:0}to{transform:none;opacity:1}}
.dlg-carte .txt{padding:1.2rem 1rem 1rem;display:grid;gap:.35rem;justify-items:center}
.dlg-carte .icone{width:3.2rem;font-size:1.2rem;margin-bottom:.3rem}
.dlg-carte h2{font-size:1.05rem}
.dlg-carte p{font-size:.85rem;color:rgba(255,255,255,.82)}
.dlg-acts{display:grid;border-top:.5px solid var(--sep)}
.dlg-acts button{min-height:2.9rem;font-size:1rem;color:var(--blue-ink);border-top:.5px solid var(--sep)}
.dlg-acts button:first-child{border-top:0}
.dlg-acts.deux{grid-template-columns:1fr 1fr}
.dlg-acts.deux button{border-top:0}
.dlg-acts.deux button+button{border-left:.5px solid var(--sep);font-weight:600}
.dlg-acts .rouge{color:var(--bad)}
.dlg-acts .gras{font-weight:600}
.ile{position:fixed;left:50%;top:calc(var(--sat) + .45rem);z-index:70;transform:translate(-50%,-.4rem) scale(.92);opacity:0;pointer-events:none;transition:all .35s var(--spring);padding:.55rem 1rem;border-radius:1.4rem;background:#000;font-size:.85rem;font-weight:600;max-width:calc(100% - 2rem);box-shadow:0 .5rem 1.5rem rgba(0,0,0,.45);text-align:center;border:.5px solid var(--line)}
.ile.on{opacity:1;transform:translate(-50%,0) scale(1)}
.maj{position:fixed;left:50%;bottom:calc(var(--sab) + 6.6rem);transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:.7rem;padding:.55rem .6rem .55rem 1rem;border-radius:1.4rem;background:var(--glass-2);border:.5px solid var(--line);font-size:.88rem;max-width:calc(100% - 2rem)}
.demarrage{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#05061a;transition:opacity .25s}
.demarrage.part{opacity:0;pointer-events:none}
.embleme{font-weight:800;font-size:2.4rem;letter-spacing:.16em;background:linear-gradient(180deg,var(--gold-soft),var(--gold) 55%,#8b6914);-webkit-background-clip:text;background-clip:text;color:transparent}
.embleme small{display:block;text-align:center;font-size:.8rem;letter-spacing:.3em;color:var(--ink-3);-webkit-text-fill-color:var(--ink-3)}

/* ---------- Tablette et ordinateur ---------- */
.tablette .grille{grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:1.6rem 1rem}
.tablette .widgets{grid-template-columns:repeat(auto-fill,minmax(13rem,1fr))}
.tablette .tuile .icone{width:4.2rem}
.tablette .feuille-in{padding-top:1.2rem}
.tablette .ctrl{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ---------- Mouvement réduit ---------- */
.calme *,.calme *::before,.calme *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<a class="saut" href="#grille" data-t="sautApps">Aller aux apps</a>
<div class="os" id="os">
  <div class="fond" aria-hidden="true"></div>
  <header class="barre" id="barre">
    <div class="barre-g"><span class="heure" id="heure" aria-live="off">--:--</span><span class="hors" id="hors" hidden data-t="horsLigne">Hors ligne</span></div>
    <div class="barre-d">
      <button class="btn-barre" id="bRech" data-ta="rechercher" aria-keyshortcuts="Control+K Meta+K"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg></button>
      <button class="btn-barre" id="bNotif" data-ta="notifications" aria-keyshortcuts="Alt+N"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg><span class="pastille" id="nbNotif" hidden>0</span><span class="lune" id="luneBarre" hidden></span></button>
      <button class="btn-barre" id="bCtrl" data-ta="centre" aria-keyshortcuts="Alt+C"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
    </div>
  </header>
  <main class="accueil" id="accueil" data-tl="accueil" tabindex="-1">
    <h1 class="vh" data-t="titreAccueil">Aypona OS 2, accueil</h1>
    <section class="widgets" id="widgets" data-tl="widgets"></section>
    <div id="bandeauEdition" hidden></div>
    <nav class="grille" id="grille" data-tl="apps" tabindex="-1"></nav>
  </main>
  <div class="dock-zone" id="dockZone"><nav class="dock" id="dock" data-tl="dock"></nav></div>
  <section class="scene" id="scene" hidden data-tl="appsOuvertes"></section>
</div>

<section class="feuille" id="fRech" hidden role="dialog" aria-modal="true" data-tl="rechercher">
  <div class="feuille-in">
    <div class="feuille-tete"><div class="boite-rech"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg><input id="rechInput" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="rechRes" aria-autocomplete="list" data-tp="rechPlace" data-ta="rechercher"></div><button class="pilule" data-ferme data-t="annuler">Annuler</button></div>
    <div id="rechRes" role="listbox" data-tl="resultats" style="display:grid;gap:1rem"></div>
  </div>
</section>
<section class="feuille" id="fNotifs" hidden role="dialog" aria-modal="true" aria-labelledby="tNotifs">
  <div class="feuille-in">
    <div class="feuille-tete"><h2 id="tNotifs" data-t="notifications">Notifications</h2><div class="boutons"><button class="pilule" id="notifsLu" data-t="toutLu">Tout lu</button><button class="pilule" id="notifsVider" data-t="effacer">Effacer</button><button class="pilule" data-ferme data-t="fermer">Fermer</button></div></div>
    <div id="notifsListe" style="display:grid;gap:1rem"></div>
  </div>
</section>
<section class="feuille" id="fCtrl" hidden role="dialog" aria-modal="true" aria-labelledby="tCtrl">
  <div class="feuille-in">
    <div class="feuille-tete"><h2 id="tCtrl" data-t="centre">Centre de contrôle</h2><button class="pilule" data-ferme data-t="fermer">Fermer</button></div>
    <div class="ctrl" id="ctrlTuiles"></div>
  </div>
</section>
<section class="feuille" id="fSel" hidden role="dialog" aria-modal="true" aria-labelledby="tSel">
  <div class="feuille-in">
    <div class="feuille-tete"><h2 id="tSel" data-t="appsOuvertes">Apps ouvertes</h2><div class="boutons"><button class="pilule" id="selTout" data-t="toutFermer">Tout fermer</button><button class="pilule" data-ferme data-t="fermer">Fermer</button></div></div>
    <div id="selCorps" style="display:grid;gap:1rem"></div>
  </div>
</section>
<section class="feuille" id="fAide" hidden role="dialog" aria-modal="true" aria-labelledby="tAide">
  <div class="feuille-in">
    <div class="feuille-tete"><h2 id="tAide" data-t="raccourcis">Raccourcis clavier</h2><button class="pilule" data-ferme data-t="fermer">Fermer</button></div>
    <div id="aideCorps"></div>
  </div>
</section>
<div class="dlg" id="dlg" hidden></div>
<div class="ile" id="ile" role="status" aria-live="polite"></div>
<div class="vh" id="annonce" aria-live="assertive"></div>
<div class="maj" id="maj" hidden role="status"><span data-t="majDispo">Nouvelle version d'Aypona OS.</span><button class="b bleu petit" id="majBtn" data-t="redemarrer">Redémarrer</button></div>
<div class="demarrage" id="demarrage" aria-hidden="true"><div class="embleme">AYPONA<small>OS 2</small></div></div>
<noscript><p style="position:fixed;inset:auto 0 0;padding:1rem;background:#000;z-index:99">Aypona OS 2 a besoin de JavaScript.</p></noscript>
<script type="module" src="js/interface.js"></script>
</body>
</html>
