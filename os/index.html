<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Aypona OS</title>
<style>
/* Aypona OS v0 · Bureau 102 (Polaris). Un téléphone plein écran sur mobile, centré dans un cadre sur ordinateur.
   Look unique et assumé : nuit iOS, verre dépoli, or Aypona. Pas de thème clair. */
:root{
  color-scheme:dark;
  --ink:#ffffff;
  --ink-2:rgba(235,235,245,.62);
  --ink-3:rgba(235,235,245,.36);
  --glass:rgba(40,40,48,.52);
  --glass-strong:rgba(28,28,32,.94);
  --line:rgba(255,255,255,.12);
  --gold:#d4af37;
  --gold-soft:#f5d061;
  --ok:#30d158;
  --warn:#ff9f0a;
  --bad:#ff453a;
  --blue:#0a84ff;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.32,1.25,.5,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:10px}
a{color:var(--blue)}

/* ---------- Appareil ---------- */
.desk{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#16161c 0%,#000 70%)}
.device{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (min-width:600px) and (min-height:700px){
  .device{width:min(430px,calc((100vh - 48px) * .46));height:min(932px,calc(100vh - 48px));border-radius:54px;box-shadow:0 0 0 11px #1c1c1f,0 0 0 12px #3a3a40,0 40px 90px rgba(0,0,0,.7)}
}

/* ---------- Fonds d'écran ---------- */
.wall{position:absolute;inset:-6%;z-index:0;transition:filter .4s var(--ease),transform .4s var(--ease)}
.wall[data-wp="aube"]{background:radial-gradient(ellipse 60% 50% at 25% 20%,#ff6b9d 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 75% 25%,#ffa06b 0%,transparent 55%),radial-gradient(ellipse 65% 55% at 70% 80%,#5b3fff 0%,transparent 60%),radial-gradient(ellipse 55% 50% at 20% 85%,#00c2ff 0%,transparent 60%),linear-gradient(135deg,#3a1c71,#241440 50%,#1a0b2e)}
.wall[data-wp="ville"]{background:radial-gradient(ellipse 80% 40% at 50% 100%,#2a2f7a 0%,transparent 70%),radial-gradient(circle at 78% 16%,rgba(255,236,190,.5) 0 2.6%,transparent 3.2%),radial-gradient(ellipse 50% 30% at 20% 75%,rgba(92,180,255,.35),transparent 70%),radial-gradient(ellipse 45% 25% at 80% 70%,rgba(179,146,255,.3),transparent 70%),linear-gradient(180deg,#05061a 0%,#0b0e26 55%,#1a1a46 100%)}
.wall[data-wp="spatial"]{background:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 48%,#fff,transparent),radial-gradient(1px 1px at 80% 12%,#fff,transparent),radial-gradient(2px 2px at 10% 80%,#fff,transparent),radial-gradient(1px 1px at 62% 24%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 60%,#fff,transparent),radial-gradient(1px 1px at 30% 92%,#fff,transparent),radial-gradient(2px 2px at 72% 82%,#fff,transparent),radial-gradient(ellipse at top,#1a1a3e 0%,transparent 60%),radial-gradient(ellipse at bottom right,#2d1b4e 0%,transparent 50%),linear-gradient(180deg,#000010,#0a0520 50%,#000005)}
.wall[data-wp="emeraude"]{background:radial-gradient(ellipse 60% 45% at 30% 25%,#1fd1a0 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 75% 75%,#0b6e4f 0%,transparent 65%),radial-gradient(ellipse 40% 35% at 85% 20%,#c8f560 0%,transparent 60%),linear-gradient(160deg,#03251c,#021a14 55%,#010d0a)}
.wall[data-wp="or"]{background:radial-gradient(ellipse 70% 45% at 50% 18%,rgba(245,208,97,.55) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 20% 85%,rgba(139,105,20,.6) 0%,transparent 65%),radial-gradient(ellipse 50% 35% at 85% 70%,rgba(212,175,55,.35) 0%,transparent 60%),linear-gradient(170deg,#140f06,#0a0805 55%,#000)}
.device.dim .wall{filter:blur(22px) brightness(.6);transform:scale(1.06)}

/* ---------- Écrans ---------- */
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px) and (min-height:700px){.screen{padding-top:14px;padding-bottom:8px}}

/* Barre d'état */
.status{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;position:relative;z-index:3}
.status .right{display:flex;gap:10px;align-items:center}
.sb-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:10px;min-height:32px}
.sb-btn svg{width:17px;height:17px}
.sb-count{font-size:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);display:grid;place-items:center;line-height:1}
.net{opacity:.95}.net.off{opacity:.35}

/* ---------- Démarrage ---------- */
#boot{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse 70% 80% at 50% 50%,#0a0a0c 0%,#000 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;transition:opacity .45s var(--ease)}
#boot.out{opacity:0;pointer-events:none}
.emblem{width:min(300px,68%);aspect-ratio:720/177;display:grid;place-items:center;animation:reveal 1s var(--ease) .1s both}
.emblem img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 14px rgba(212,175,55,.45)) drop-shadow(0 0 28px rgba(212,175,55,.2))}
.emblem .word{font-weight:800;font-size:44px;letter-spacing:.14em;background:linear-gradient(180deg,var(--gold-soft),var(--gold) 55%,#8b6914);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes reveal{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.bootbar{width:min(220px,56%);height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.5);transition:width .2s linear}
.bootlog{font:11px/1.6 var(--mono);color:var(--ink-3);text-align:center;min-height:3.2em}

/* ---------- Écran verrouillé ---------- */
#lock{z-index:20;transition:transform .5s var(--ease),opacity .4s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-head{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6vh}
.lock-date{font-size:19px;font-weight:600;color:rgba(255,255,255,.85);text-transform:capitalize}
.lock-time{font-size:min(96px,24vw);font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.lock-notes{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px));min-height:0;overflow:hidden}
.lock-foot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:18px}
.unlock{font-size:15px;font-weight:500;color:rgba(255,255,255,.75);padding:10px 18px;border-radius:999px;animation:hint 2.6s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-5px);opacity:1}}

/* Cartes de notification */
.note{display:grid;grid-template-columns:38px 1fr auto;gap:2px 10px;align-items:start;padding:12px 14px;border-radius:20px;background:var(--glass);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:.5px solid var(--line)}
.note .ic{grid-row:span 2;width:38px;height:38px;border-radius:9px;display:grid;place-items:center}
.note .ic svg{width:60%;height:60%}
.note b{font-size:14px;min-width:0}
.note time{font-size:12px;color:var(--ink-2);white-space:nowrap}
.note p{grid-column:2 / 4;font-size:14px;color:rgba(255,255,255,.88);min-width:0}

/* Barre d'accueil (bas) */
.homebar{width:136px;height:5px;border-radius:3px;background:#fff;opacity:.9}
.homezone{display:grid;place-items:center;height:28px;width:100%;touch-action:none}

/* ---------- Accueil ---------- */
#home{z-index:5}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:8px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));min-width:0;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;gap:22px 8px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;border-radius:16px;padding:2px 0;touch-action:manipulation}
.editing .app{touch-action:none}
.icon{width:min(62px,15.5vw);aspect-ratio:1;border-radius:22.5%;display:grid;place-items:center;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.22);transition:transform .18s var(--ease)}
.icon svg{width:58%;height:58%}
.app:active .icon{transform:scale(.9)}
.label{font-size:12px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.5);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .label{display:none}
.icon .badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);font-size:13px;font-weight:600;display:grid;place-items:center}

/* Widgets */
.widget{grid-column:span 2;aspect-ratio:1;border-radius:22px;padding:14px;background:var(--glass);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:.5px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden;text-align:left}
.widget small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.w-clock .t{font-size:min(44px,11vw);font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.w-clock .d{font-size:14px;color:var(--ink-2);text-transform:capitalize}
.w-sys .v{font:600 22px/1.1 var(--mono);color:var(--gold-soft)}
.w-sys ul{list-style:none;display:grid;gap:3px;font-size:12.5px}
.w-sys li{display:flex;gap:6px;align-items:center;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok)}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

.empty{margin:auto;max-width:280px;text-align:center;display:grid;gap:8px;padding:20px;border-radius:24px;background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:.5px solid var(--line)}
.empty b{font-size:17px}.empty p{font-size:14px;color:var(--ink-2)}

.dots{display:flex;justify-content:center;gap:8px;padding:10px 0}
.dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);padding:0;min-height:0}
.dots button.on{background:#fff}
.searchpill{align-self:center;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:.5px solid var(--line);margin-bottom:10px}
.searchpill svg{width:14px;height:14px}
.dockwrap{padding:0 max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.dock{display:flex;gap:min(22px,5vw);justify-content:center;padding:12px 18px;border-radius:32px;min-height:86px;min-width:min(100%,340px);background:rgba(255,255,255,.17);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid rgba(255,255,255,.2)}

/* Mode édition */
.editing .app .icon{animation:jiggle .28s ease-in-out infinite alternate}
.editing .app:nth-child(2n) .icon{animation-delay:-.14s}
@keyframes jiggle{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.editbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(14px,env(safe-area-inset-right,0px));z-index:6;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-weight:600;font-size:14px;min-height:32px}
@media (min-width:600px) and (min-height:700px){.editbar{top:16px}}
.drag-ghost{position:absolute;z-index:40;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
.app.drop .icon{outline:2px solid rgba(255,255,255,.75);outline-offset:3px}
.app.lifted{opacity:.25}

/* ---------- Fenêtre d'app ---------- */
#win{position:absolute;inset:0;z-index:15;background:#000;display:flex;flex-direction:column;border-radius:0;overflow:hidden;transform-origin:50% 50%}
#win.opening{animation:winIn .42s var(--ease) both}
#win.closing{animation:winOut .3s var(--ease) both}
@keyframes winIn{from{transform:translate(var(--dx),var(--dy)) scale(.16);border-radius:60px;opacity:.4}to{transform:none;border-radius:0;opacity:1}}
@keyframes winOut{to{transform:translate(var(--dx),var(--dy)) scale(.16);border-radius:60px;opacity:0}}
.win-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;background:#000}
.win-foot{flex:none;background:#000}

/* Vues natives (style Réglages) */
.nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.nav h1{font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.nav .back{justify-self:start;color:var(--blue);display:inline-flex;align-items:center;gap:2px;font-size:17px;min-height:44px;padding:0 6px}
.nav .back svg{width:12px;height:20px}
.view{padding:12px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px;align-content:start}
.big{font-size:32px;font-weight:700;letter-spacing:-.01em;padding:4px 4px 0}
.sec{display:grid;gap:6px}
.sec > h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);padding:0 16px}
.sec > p.foot{font-size:13px;color:var(--ink-2);padding:0 16px}
.list{border-radius:12px;background:#1c1c1e;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 16px;width:100%;text-align:left;border-top:.5px solid rgba(84,84,88,.55)}
.list > .row:first-child{border-top:0}
.row .ri{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none}
.row .ri svg{width:62%;height:62%}
.row .rl{flex:1;min-width:0}
.row .rl small{display:block;font-size:13px;color:var(--ink-2)}
.row .rv{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}
.row .chev{width:8px;height:14px;color:var(--ink-3);flex:none}
.row.danger{color:var(--bad);justify-content:center}
.row.link{color:var(--blue)}
.mono{font-family:var(--mono);font-size:13px}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:#39393d;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .22s var(--spring)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px;padding:14px;border-radius:12px;background:#1c1c1e}
.wp{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--ink-2)}
.wp .sw{width:100%;max-width:100%;aspect-ratio:9/16;border-radius:12px;position:relative;overflow:hidden;border:2px solid transparent}
.wp .sw .wall{inset:0}
.wp[aria-pressed="true"] .sw{border-color:var(--blue)}
.wp[aria-pressed="true"]{color:var(--ink)}
.prose{display:grid;gap:10px;padding:14px 16px;border-radius:12px;background:#1c1c1e;font-size:15px;color:rgba(255,255,255,.88)}
.prose b{color:#fff}
.log{list-style:none;display:grid;gap:0;border-radius:12px;background:#1c1c1e;overflow:hidden}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 14px;font-size:13px;border-top:.5px solid rgba(84,84,88,.55);min-width:0}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.log span{min-width:0;overflow-wrap:anywhere}

/* ---------- Feuilles (Spotlight, Notifications) ---------- */
.sheet{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;background:rgba(0,0,0,.35);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);transition:opacity .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px) and (min-height:700px){.sheet{padding-top:14px}}
.sheet.enter{animation:sheetIn .32s var(--ease) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.sheet-in{flex:1;min-height:0;overflow-y:auto;padding:10px max(14px,env(safe-area-inset-right,0px)) 18px max(14px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.searchbox{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-radius:12px;background:rgba(120,120,130,.32);border:.5px solid var(--line)}
.searchbox svg{width:16px;height:16px;flex:none;opacity:.7}
.searchbox input{flex:1;min-width:0;background:none;border:0;color:#fff;font:17px var(--ui);outline:none}
.searchbox input::placeholder{color:rgba(255,255,255,.55)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:28px;font-weight:700}
.pillbtn{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);font-size:14px;font-weight:600;min-height:32px}
.res{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;width:100%;text-align:left;background:var(--glass)}
.res .icon{width:40px;border-radius:10px}
.res small{display:block;color:var(--ink-2);font-size:13px}
.res mark{background:none;color:var(--gold-soft);font-weight:700}
.muted{color:var(--ink-2);font-size:14px;text-align:center;padding:24px 0}

/* ---------- Dialogue et toast ---------- */
.dlg{position:absolute;inset:0;z-index:45;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:24px}
.dlg-card{width:min(280px,100%);border-radius:14px;background:rgba(44,44,48,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);text-align:center;overflow:hidden;animation:pop .22s var(--spring) both}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
.dlg-card .txt{padding:18px 16px 16px;display:grid;gap:4px}
.dlg-card b{font-size:17px}
.dlg-card p{font-size:13px;color:rgba(255,255,255,.8)}
.dlg-card .acts{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid rgba(84,84,88,.65)}
.dlg-card .acts button{min-height:44px;font-size:17px;color:var(--blue)}
.dlg-card .acts button+button{border-left:.5px solid rgba(84,84,88,.65);font-weight:600}
.dlg-card .acts button.red{color:var(--bad)}
#island{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:48;transform:translate(-50%,-6px) scale(.9);opacity:0;pointer-events:none;transition:all .35s var(--spring);padding:9px 16px;border-radius:22px;background:#000;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center}
@media (min-width:600px) and (min-height:700px){#island{top:14px}}
#island.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* Icônes système : couleurs */
.c-reglages{background:linear-gradient(180deg,#8e8e93,#48484a)}
.c-store{background:linear-gradient(180deg,#1ec8ff,#0a6cff)}
.c-moniteur{background:linear-gradient(180deg,#2c2c2e,#0b0b0d);border:.5px solid rgba(255,255,255,.12)}
.c-astuces{background:linear-gradient(180deg,#ffd60a,#ff9f0a)}
.c-aypona{background:linear-gradient(135deg,#f5d061,#d4af37 40%,#8b6914 75%,#2a1a3a)}
.c-bleu{background:var(--blue)}.c-gris{background:#636366}.c-vert{background:var(--ok)}.c-rouge{background:var(--bad)}.c-violet{background:#5e5ce6}.c-orange{background:var(--warn)}

.reduce *,.reduce *::before,.reduce *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ---------- v0.2 · Bureau 102 ---------- */
.homezone.homebarzone{height:24px}
.c-fichiers{background:linear-gradient(180deg,#5ac8fa,#0a84ff)}
.c-installe{background:linear-gradient(180deg,#3a3a3c,#1c1c1e)}
.dom{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);white-space:nowrap}
.dom i{width:8px;height:8px;border-radius:50%;flex:none}
.dom-prive i{background:#ff6fae}.dom-service i{background:#5ef0ff}.dom-public i{background:#f4f6ff}
.legend{display:flex;flex-wrap:wrap;gap:8px}

/* Sélecteur d'apps */
.sw-cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 18px;scrollbar-width:none;min-height:0}
.sw-cards::-webkit-scrollbar{display:none}
.sw-card{flex:0 0 min(62%,240px);scroll-snap-align:center;display:grid;gap:10px;justify-items:center;text-align:center;padding:16px 12px 14px;border-radius:26px;background:var(--glass);border:.5px solid var(--line);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);position:relative;aspect-ratio:9/14;align-content:center;touch-action:pan-x}
.sw-card .icon{width:72px}
.sw-card b{font-size:16px}
.sw-card small{color:var(--ink-2);font-size:13px}
.sw-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px;line-height:1}
.sw-card.leaving{transition:transform .25s var(--ease),opacity .25s;transform:translateY(-40%);opacity:0}

/* Hôte d'apps */
.appframe{flex:1;display:flex;flex-direction:column;min-height:100%}
.appframe iframe{flex:1;width:100%;min-height:calc(100vh - 120px);border:0;background:#fff;display:block}
.appbar{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:#0d0d10;border-bottom:.5px solid var(--line);min-height:48px}
.appbar .icon{width:30px;border-radius:8px}
.appbar b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extcard{margin:auto;display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 22px;max-width:320px}
.extcard .icon{width:88px}
.extcard h2{font-size:24px}
.extcard p{color:var(--ink-2);font-size:14px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;padding:12px 20px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;text-decoration:none;min-height:44px}
.ghostbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:600;min-height:44px}
.bluebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;min-height:44px}
.bluebtn[disabled],.ghostbtn[disabled]{opacity:.4;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
#switcher .sheet-head h2{font-size:24px}

/* Champs */
.fld{display:grid;gap:6px;padding:12px 16px;border-radius:12px;background:#1c1c1e}
.fld label{font-size:13px;color:var(--ink-2)}
.fld input,.fld textarea{width:100%;min-width:0;background:#2c2c2e;border:.5px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font:15px/1.45 var(--ui);padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text}
.fld textarea{min-height:42vh;resize:vertical;font-family:var(--ui)}
.fld textarea.code{min-height:180px;font:13px/1.5 var(--mono)}
.fld input:focus,.fld textarea:focus{border-color:var(--blue)}
.msgs{list-style:none;display:grid;gap:6px;font-size:13.5px}
.msgs li{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:10px;background:rgba(255,69,58,.12);color:#ffb3ad}
.msgs li.ok{background:rgba(48,209,88,.12);color:#9ff0b5}
.row .rv .dom{font-weight:600}
.storeapp{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;border-top:.5px solid rgba(84,84,88,.55)}
.list > .storeapp:first-child{border-top:0}
.storeapp .icon{width:46px;border-radius:11px;grid-row:span 2}
.storeapp b{font-size:15px;min-width:0}
.storeapp small{grid-column:2;color:var(--ink-2);font-size:13px;min-width:0}
.storeapp .act{grid-column:3;grid-row:1 / span 2}
.filemeta{font-size:12.5px;color:var(--ink-2)}
.w-list ul{list-style:none;display:grid;gap:4px;font-size:12.5px;min-width:0}
.w-list li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-list .big-n{font-size:30px;font-weight:700;line-height:1}

<script>

  on(ev,fn){ (handlers[ev]=handlers[ev]||[]).push(fn); return ()=>{ handlers[ev]=handlers[ev].filter(f=>f!==fn); }; },

    (handlers[ev]||[]).slice().forEach(fn=>{ try{ fn(data); }catch(e){ console.error('[Aypona] '+ev,e); } }); },
  journal:()=>journal.slice(),
};

/* ---------- Stockage (registre des clés, préfixe propre à l'OS) ---------- */
const PREFIX='aypona-os:';
const KEYS=Object.freeze({ schema:'schema', settings:'settings', layout:'layout', notifs:'notifs', installed:'installed', boots:'boots', files:'files', recents:'recents', prive:'prive', tipsSeen:'tipsSeen' });

  key:k=>PREFIX+(KEYS[k]||k),
  get(k,def){ const key=storage.key(k); try{ const raw=localStorage.getItem(key); if(raw==null) return k in mem? mem[k] : def; return JSON.parse(raw); }catch(e){ persistent=false; return k in mem? mem[k] : def; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(storage.key(k),JSON.stringify(v)); return true; }catch(e){ persistent=false; return false; } },
  remove(k){ delete mem[k]; try{ localStorage.removeItem(storage.key(k)); }catch(e){} },
  usage(){ let n=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PREFIX)) n+=k.length+(localStorage.getItem(k)||'').length; } }catch(e){} return n*2; },
  wipe(){ try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(PREFIX)) ks.push(k); } ks.forEach(k=>localStorage.removeItem(k)); }catch(e){} for(const k in mem) delete mem[k]; },
  get persistent(){ return persistent; },
};
const MIGRATIONS={
  1:()=>{ /* schéma initial */ },
  2:()=>{ /* v0.2 : widgets, notifications par app, fichiers, apps récentes */
    const s=storage.get('settings',{})||{}; if(!Array.isArray(s.widgets)) s.widgets=['horloge','systeme']; if(!s.notifApps||typeof s.notifApps!=='object') s.notifApps={}; storage.set('settings',s);
    if(!Array.isArray(storage.get('files',null))) storage.set('files',[]);
    if(!Array.isArray(storage.get('recents',null))) storage.set('recents',[]);
    if(!storage.get('prive',null)) storage.set('prive',{}); },
};
function migrate(){ let v=storage.get('schema',0); const from=v; while(v<SCHEMA){ v++; if(MIGRATIONS[v]) MIGRATIONS[v](); } storage.set('schema',SCHEMA); return { from, to:SCHEMA }; }

/* ---------- Langues ---------- */
const DICT={
  fr:{ search:'Rechercher', cancel:'Annuler', done:'OK', close:'Fermer', clear:'Effacer', notifs:'Notifications', unlock:'Glisser vers le haut pour déverrouiller',

    wallpaper:'Fond d’écran', general:'Général', about:'À propos', language:'Langue', motion:'Réduire les animations', lockNow:'Verrouiller l’écran', reset:'Réinitialiser Aypona OS',

    version:'Version', build:'Build', storage:'Stockage local', saved:'enregistré', notSaved:'non enregistré (navigateur)', tests:'Tests du noyau', modules:'Modules du noyau', events:'Journal du système',
    welcomeT:'Bienvenue dans Aypona OS', welcomeP:'Version 0.2 : les apps arrivent avec leur manifeste. Glisse vers le haut sur la barre du bas pour voir les apps ouvertes.', rebootT:'Aypona OS a redémarré', rebootP:'Démarrage n°{n} sur ce navigateur.', updT:'Aypona OS 0.2 est installé', updP:'Nouveautés : apps avec manifeste, sélecteur d’apps, Fichiers, widgets au choix.',
    editHint:'Appui long sur une icône pour réorganiser', moved:'Disposition enregistrée', resetDone:'Aypona OS réinitialisé', installed:'Apps installées', online:'En ligne', offline:'Hors ligne',
    city:'Retour à Aypona City', settingsSearch:'Réglage', appSearch:'App', fileSearch:'Fichier', switcher:'Apps ouvertes', noRecents:'Aucune app ouverte récemment', closeAll:'Tout fermer',
    widgets:'Widgets', apps:'Apps', dev:'Développeur', install:'Installer', uninstall:'Désinstaller', open:'Ouvrir' },

    reglages:'Settings', store:'App Store', moniteur:'Monitor', astuces:'Tips', fichiers:'Files', today:'Today', noNotifs:'No notifications', noResults:'No results',

    wallpaper:'Wallpaper', general:'General', about:'About', language:'Language', motion:'Reduce motion', lockNow:'Lock screen', reset:'Reset Aypona OS',
    resetQ:'Reset Aypona OS?', resetP:'Settings, layout, installed apps, files and notifications in this browser will be erased.', resetYes:'Reset',

};
const i18n={
  lang:()=>settings.get('lang'),
  t(key,vars){ const d=DICT[i18n.lang()]||DICT.fr; let s=d[key]!=null? d[key] : (DICT.fr[key]!=null? DICT.fr[key] : key); if(vars) for(const k in vars) s=s.replace('{'+k+'}',vars[k]); return s; },
  apply(root=document){ root.querySelectorAll('[data-t]').forEach(e=>{ e.textContent=i18n.t(e.dataset.t); }); root.querySelectorAll('[data-tp]').forEach(e=>{ e.placeholder=i18n.t(e.dataset.tp); }); document.documentElement.lang=i18n.lang(); },

const t=i18n.t;

/* ---------- Réglages ---------- */
const WIDGETS=['horloge','systeme','notifs','fichiers'];
const DEFAULTS=Object.freeze({ wallpaper:'aube', lang:'fr', reduceMotion:false, widgets:['horloge','systeme'], notifApps:{} });
let cfg={ ...DEFAULTS, ...(storage.get('settings',{})||{}) };
const settings={
  get:k=>cfg[k],
  set(k,v){ if(!(k in DEFAULTS)) return false; if(k==='widgets'){ if(!Array.isArray(v)) return false; v=v.filter((w,i)=>WIDGETS.includes(w)&&v.indexOf(w)===i).slice(0,4); }
    cfg={ ...cfg, [k]:v }; storage.set('settings',cfg); bus.emit('settings:'+k,v); bus.emit('settings',{ [k]:v }); return true; },
  all:()=>({ ...cfg }),

/* ---------- Manifeste d'app (décret n°2 du mandat IV) ----------
   Contrat entre le système et l'App Store. Mêmes règles que le validateur du bureau 102 dans la ville.
   { id, nom, studio, version, domicile:'prive'|'service'|'public', entree, icone:{couleur,glyphe}, permissions:[], description }
   - privé : aucune adresse dans le manifeste (elle reste sur l'appareil) ;
   - service : adresse https (Netlify ou autre) ;
   - public : adresse https (GitHub Pages) ou chemin publié avec le système (apps/<id>/…html). */
const STUDIOS=['Devea','Nativus','BroNet','8Pool','Neural Pro'];
const DOMICILES={ prive:{ nom:'privé', css:'#ff6fae' }, service:{ nom:'service', css:'#5ef0ff' }, public:{ nom:'public', css:'#f4f6ff' } };
const PERMISSIONS={ notifications:'Envoyer des notifications', fichiers:'Lire et écrire ses propres fichiers' };
const RESERVED=['reglages','store','moniteur','astuces','fichiers','aypona','systeme'];
const manifest={
  validate(m){
    const err=[], out={};
    if(!m||typeof m!=='object'||Array.isArray(m)) return { ok:false, errors:['Le manifeste doit être un objet.'], manifeste:null };
    const str=v=>typeof v==='string'? v.trim() : '';
    out.id=str(m.id); if(!/^[a-z][a-z0-9-]{1,31}$/.test(out.id)) err.push('id : 2 à 32 caractères, minuscules, chiffres et tirets, en commençant par une lettre.'); else if(RESERVED.includes(out.id)) err.push('id : « '+out.id+' » est réservé au système.');
    out.nom=str(m.nom); if(out.nom.length<2||out.nom.length>24||/[<>]/.test(out.nom)) err.push('nom : 2 à 24 caractères, sans < ni >.');
    out.studio=str(m.studio); if(!STUDIOS.includes(out.studio)) err.push('studio : '+STUDIOS.join(', ')+'.');
    out.version=str(m.version); if(!/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(out.version)) err.push('version : trois nombres, par exemple 1.0.0.');
    out.domicile=str(m.domicile); if(!DOMICILES[out.domicile]) err.push('domicile : prive, service ou public.');
    out.entree=str(m.entree);
    if(out.domicile==='prive'){ if(out.entree) err.push('entree : une app privée ne publie pas son adresse, elle se règle sur l’appareil.'); }
    else if(DOMICILES[out.domicile]){
      const rel=/^apps\/[a-z0-9-]+\/[A-Za-z0-9._\/-]*\.html$/.test(out.entree)&&!out.entree.includes('..');
      let https=false; try{ const u=new URL(out.entree); https=u.protocol==='https:'&&!u.username&&!u.password; }catch(e){}
      if(!out.entree) err.push('entree : adresse obligatoire pour une app '+DOMICILES[out.domicile].nom+'.');
      else if(out.domicile==='service'&&!https) err.push('entree : une app de service s’ouvre par une adresse https.');
      else if(out.domicile==='public'&&!https&&!rel) err.push('entree : adresse https, ou chemin apps/'+(out.id||'<id>')+'/….html publié avec le système.');
      else if(rel&&!out.entree.startsWith('apps/'+out.id+'/')) err.push('entree : le chemin doit commencer par apps/'+out.id+'/.');
    }
    const ic=m.icone&&typeof m.icone==='object'? m.icone : {};
    out.icone={ couleur:/^#[0-9a-fA-F]{6}$/.test(ic.couleur||'')? ic.couleur : '#636366', glyphe:str(ic.glyphe).replace(/[<>&"']/g,'').slice(0,2) || (out.nom[0]||'?').toUpperCase() };
    const perms=m.permissions==null? [] : m.permissions;
    if(!Array.isArray(perms)) err.push('permissions : une liste.'); else { const bad=perms.filter(p=>!PERMISSIONS[p]); if(bad.length) err.push('permissions inconnues : '+bad.join(', ')+'.'); out.permissions=[...new Set(perms.filter(p=>PERMISSIONS[p]))]; }
    if(!out.permissions) out.permissions=[];
    out.description=str(m.description).replace(/[<>]/g,'').slice(0,140);
    return { ok:!err.length, errors:err, manifeste:err.length? null : out };
  },
  exemple:()=>({ id:'exemple-notes', nom:'Notes', studio:'Nativus', version:'1.0.0', domicile:'public', entree:'https://exemple.github.io/notes/', icone:{ couleur:'#ffd60a', glyphe:'N' }, permissions:['fichiers'], description:'Exemple de manifeste : une app de notes publique.' }),
};

/* ---------- Fichiers (stockage local, chaque app ne voit que les siens) ---------- */
const FILE_MAX=200*1024, FILES_MAX=1024*1024;
const files={
  all:()=>storage.get('files',[])||[],
  list(app){ return files.all().filter(f=>!app||f.app===app).sort((a,b)=>b.modifie-a.modifie); },
  get(id,app){ const f=files.all().find(x=>x.id===id); return f&&(!app||f.app===app)? f : null; },
  find(nom,app){ return files.all().find(x=>x.nom===nom&&x.app===app)||null; },
  usage(){ return files.all().reduce((s,f)=>s+(f.contenu||'').length+(f.nom||'').length,0); },
  save({ id, nom, contenu, app }){
    nom=String(nom||'').trim().replace(/[\\/<>:"|?*]/g,'').slice(0,60); contenu=String(contenu==null?'':contenu); app=app||'fichiers';
    if(!nom) return { ok:false, error:'Donne un nom au fichier.' };
    if(contenu.length>FILE_MAX) return { ok:false, error:'Fichier trop gros : 200 Ko au maximum.' };
    const all=files.all(), cur=id? all.find(f=>f.id===id&&f.app===app) : null;
    if(id&&!cur) return { ok:false, error:'Fichier introuvable.' };
    if(all.some(f=>f.nom===nom&&f.app===app&&f!==cur)) return { ok:false, error:'Un fichier porte déjà ce nom.' };
    const size=files.usage()-(cur? (cur.contenu.length+cur.nom.length) : 0)+contenu.length+nom.length;
    if(size>FILES_MAX) return { ok:false, error:'Espace plein : 1 Mo de fichiers au maximum dans ce navigateur.' };
    const f=cur||{ id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), cree:Date.now(), app };
    Object.assign(f,{ nom, contenu, modifie:Date.now(), taille:new Blob([contenu]).size });
    const next=cur? all.map(x=>x.id===f.id?f:x) : [f,...all]; storage.set('files',next); bus.emit('files',{ id:f.id }); return { ok:true, file:f };
  },
  remove(id,app){ const all=files.all(), f=all.find(x=>x.id===id&&(!app||x.app===app)); if(!f) return false; storage.set('files',all.filter(x=>x!==f)); bus.emit('files',{ removed:id }); return true; },
};

/* ---------- Hôte d'apps : messages entre une app et le système ----------
   Une app publiée avec le système (apps/<id>/…) tourne dans un cadre isolé (sandbox, origine opaque).
   Elle parle au système par postMessage : { aypona:1, id, type, ... } ; la réponse porte re = id.
   Types : hello ; notify {titre, texte} (permission notifications) ; fichiers.liste, fichiers.lire {nom}, fichiers.ecrire {nom, contenu}, fichiers.supprimer {nom} (permission fichiers).
   Les messages ne sont acceptés que du cadre de l'app ouverte. */
const host={
  frame:null, app:null,
  handle(app,msg){
    if(!msg||msg.aypona!==1||typeof msg.type!=='string') return null;
    const need=p=>{ if(!(app.permissions||[]).includes(p)) throw new Error('Permission « '+p+' » absente du manifeste.'); };
    switch(msg.type){
      case 'hello': return { version:VERSION, lang:i18n.lang(), app:app.id, permissions:app.permissions||[] };
      case 'notify': need('notifications'); { const n=notify.add({ app:app.id, title:msg.titre||app.nom, body:msg.texte||'' }); if(!n) throw new Error('Notifications coupées pour cette app dans Réglages.'); return { id:n.id }; }
      case 'fichiers.liste': need('fichiers'); return files.list(app.id).map(f=>({ nom:f.nom, taille:f.taille, modifie:f.modifie }));
      case 'fichiers.lire': need('fichiers'); { const f=files.find(String(msg.nom||''),app.id); if(!f) throw new Error('Fichier introuvable.'); return { nom:f.nom, contenu:f.contenu }; }
      case 'fichiers.ecrire': need('fichiers'); { const cur=files.find(String(msg.nom||'').trim(),app.id); const r=files.save({ id:cur&&cur.id, nom:msg.nom, contenu:msg.contenu, app:app.id }); if(!r.ok) throw new Error(r.error); return { nom:r.file.nom, taille:r.file.taille }; }
      case 'fichiers.supprimer': need('fichiers'); { const f=files.find(String(msg.nom||''),app.id); if(!f) throw new Error('Fichier introuvable.'); files.remove(f.id,app.id); return { ok:true }; }
      default: throw new Error('Type de message inconnu : '+msg.type);
    }
  },
};
addEventListener('message',e=>{
  if(!host.frame||e.source!==host.frame.contentWindow||!host.app) return;
  const msg=e.data; if(!msg||msg.aypona!==1) return;
  let reply; try{ reply={ aypona:1, re:msg.id, ok:true, data:host.handle(host.app,msg) }; }catch(err){ reply={ aypona:1, re:msg.id, ok:false, error:err.message }; }
  bus.emit('host:'+msg.type,host.app.id);
  try{ e.source.postMessage(reply,'*'); }catch(err){}
});

/* ---------- Catalogue de la ville (lecture seule) ----------
   L'App Store de la ville (bureau 102) publie les apps dans la collection apps : { manifeste, demande }.
   Statut calculé comme dans la ville : publiée 12 h après la demande. Le système ne fait que lire. */
const AUDIT_H=12;
const city={ ok:false, apps:[], tried:false,
  status:a=>Date.now()>=(a.demande||0)+AUDIT_H*36e5? 'publiée' : 'en audit',
  async connect(){ city.tried=true; try{ if(!window.claude||typeof window.claude.use!=='function'){ bus.emit('city',false); return; }
    const db=await window.claude.use('db'); if(!db){ bus.emit('city',false); return; }
    db.collection('apps').onSnapshot(snap=>{ city.apps=snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(a=>a&&a.manifeste); city.ok=true; bus.emit('city',true); },()=>{ bus.emit('city',false); });
  }catch(e){ bus.emit('city',false); } },
};

/* ---------- Tests du noyau ---------- */
function runTests(){
  const r=[]; const ok=(name,cond)=>r.push({ name, pass:!!cond });
  const keep={ files:storage.get('files',[]), recents:storage.get('recents',[]), notifs:storage.get('notifs',[]) };
  try{
    storage.set('__test',{ a:1 }); ok('Stockage : écriture et lecture', (storage.get('__test')||{}).a===1); storage.remove('__test'); ok('Stockage : suppression', storage.get('__test','x')==='x');
    let hit=0; const off=bus.on('__ping',d=>{ hit+=d; }); bus.emit('__ping',2); off(); bus.emit('__ping',5); ok('Bus : abonnement et désabonnement', hit===2);
    ok('Réglages : valeurs par défaut', ['wallpaper','lang','reduceMotion','widgets','notifApps'].every(k=>k in cfg));
    ok('Langues : FR et EN complets', Object.keys(DICT.fr).every(k=>k in DICT.en));
    ok('Langues : repli sur la clé', t('__inconnue')==='__inconnue');
    const before=notify.list().length; const n=notify.add({ title:'test' }); ok('Notifications : ajout', notify.list().length===before+1); notify.remove(n.id); ok('Notifications : retrait', notify.list().length===before);
    ok('Migrations : schéma à jour', storage.get('schema',0)===SCHEMA);
    const l=layout.repair(), ids=[...l.grid,...l.dock]; ok('Accueil : chaque app placée une seule fois', ids.length===new Set(ids).size && Object.keys(apps.all()).every(id=>ids.includes(id)));
    ok('Accueil : dock de 4 apps maximum', l.dock.length<=4);
    ok('Sécurité : aucune licence ni code dans le navigateur', !('ACCOUNTS' in window) && !('APPS_CATALOG' in window));
    const ex=manifest.exemple();
    ok('Manifeste : exemple accepté', manifest.validate(ex).ok);
    ok('Manifeste : id invalide ou réservé refusé', !manifest.validate({ ...ex, id:'../x' }).ok && !manifest.validate({ ...ex, id:'reglages' }).ok);
    ok('Manifeste : studio inconnu refusé', !manifest.validate({ ...ex, studio:'Inconnu' }).ok);
    ok('Manifeste : adresse non https refusée', !manifest.validate({ ...ex, entree:'http://exemple.org' }).ok && !manifest.validate({ ...ex, entree:'javascript:alert(1)' }).ok && !manifest.validate({ ...ex, entree:'apps/autre/index.html' }).ok);
    ok('Manifeste : app privée sans adresse publiée', !manifest.validate({ ...ex, domicile:'prive' }).ok && manifest.validate({ ...ex, domicile:'prive', entree:'' }).ok);
    ok('Manifeste : permission inconnue refusée', !manifest.validate({ ...ex, permissions:['camera'] }).ok);
    const w=files.save({ nom:'__test.txt', contenu:'abc', app:'__t1' }); const rd=w.ok&&files.get(w.file.id,'__t1'); ok('Fichiers : écriture, lecture, suppression', w.ok&&rd&&rd.contenu==='abc'&&files.remove(w.file.id,'__t1')&&!files.get(w.file.id));
    const a1=files.save({ nom:'a.txt', contenu:'1', app:'__t1' }), a2=files.save({ nom:'b.txt', contenu:'2', app:'__t2' });
    ok('Fichiers : une app ne voit que les siens', files.list('__t1').length===1 && !files.get(a2.file.id,'__t1')); files.remove(a1.file.id); files.remove(a2.file.id);
    ok('Fichiers : refus au-delà de 200 Ko', !files.save({ nom:'gros.txt', contenu:'x'.repeat(FILE_MAX+1), app:'__t1' }).ok);
    let refused=false; try{ host.handle({ id:'__t', nom:'T', permissions:[] },{ aypona:1, type:'notify', titre:'x' }); }catch(e){ refused=true; }
    ok('Hôte : refus d’une demande sans permission', refused && host.handle({ id:'__t', nom:'T', permissions:[] },{ aypona:1, type:'hello' }).app==='__t');
    storage.set('recents',[]); ['reglages','store','fichiers','moniteur','astuces','reglages','store','fichiers'].forEach(id=>recents.touch(id));
    ok('Sélecteur : 6 apps récentes au maximum, sans doublon', (storage.get('recents',[])||[]).length<=RECENTS_MAX && new Set((storage.get('recents',[])||[]).map(x=>x.id)).size===(storage.get('recents',[])||[]).length);
    const wkeep=cfg.widgets; settings.set('widgets',['horloge','pirate','horloge']); ok('Widgets : seuls les widgets connus, sans doublon', JSON.stringify(cfg.widgets)==='["horloge"]'); cfg={ ...cfg, widgets:wkeep }; storage.set('settings',cfg);
  }catch(e){ console.error(e); ok('Tests : exécution sans exception', false); }
  storage.set('files',keep.files); storage.set('recents',keep.recents); storage.set('notifs',keep.notifs);
  return r;
}

/* Horloge */
const loc=()=>i18n.lang()==='en'?'en-GB':'fr-FR';
const fmtTime=d=>d.toLocaleTimeString(loc(),{ hour:'2-digit', minute:'2-digit' });
const fmtDate=d=>d.toLocaleDateString(loc(),{ weekday:'long', day:'numeric', month:'long' });
const fmtAgo=ts=>{ const m=Math.round((Date.now()-ts)/6e4); if(m<1) return i18n.lang()==='en'?'now':'maintenant'; if(m<60) return m+' min'; const hh=Math.round(m/60); if(hh<24) return hh+' h'; return new Date(ts).toLocaleDateString(loc(),{ day:'numeric', month:'short' }); };
const fmtSize=n=>n<1024? n+' o' : (n/1024).toFixed(n<10240?1:0)+' Ko';
function tick(){ const d=new Date(), tm=fmtTime(d);
  $('#sbTime').textContent=tm; $('#lkTime').textContent=tm; $('#lkDate').textContent=fmtDate(d);
  document.querySelectorAll('[data-clock]').forEach(e=>{ e.textContent=e.dataset.clock==='t'? tm : fmtDate(d); }); }

/* ---------- Écran d'accueil ---------- */

  const l=layout.repair(); if(JSON.stringify(l)!==JSON.stringify(layout.get())) storage.set('layout',l);

  const sys=l.grid.filter(id=>SYSTEM_APPS[id]), inst=l.grid.filter(id=>!SYSTEM_APPS[id]);
  pages.append(h('div',{ class:'page' },h('div',{ class:'grid' }, (settings.get('widgets')||[]).map(w=>WIDGET_RENDER[w]&&WIDGET_RENDER[w]()), sys.map(id=>appTile(id,'grid')))));

/* ---------- Ouverture et fermeture d'une app ---------- */
let current=null;
function setOrigin(win,fromEl){ const dr=device.getBoundingClientRect(), r=(fromEl&&fromEl.isConnected? fromEl : device).getBoundingClientRect();
  win.style.setProperty('--dx',((r.left+r.width/2)-(dr.left+dr.width/2))+'px'); win.style.setProperty('--dy',((r.top+r.height/2)-(dr.top+dr.height/2))+'px'); }
function openApp(id,fromEl){
  const a=apps.get(id); if(!a||editing) return;
  closeSheets();
  const win=$('#win'), body=$('#winBody'); body.innerHTML=''; body.scrollTop=0; host.frame=null; host.app=null;
  setOrigin(win,fromEl); current={ id, from:fromEl };
  if(a.system) a.open(body); else AppHost(body,a);
  win.hidden=false; win.classList.remove('closing'); win.classList.add('opening'); device.classList.add('dim');
  recents.touch(id); bus.emit('app:open',id); setTimeout(()=>{ const f=body.querySelector('button,input,a,[tabindex]'); if(f) f.focus({ preventScroll:true }); },60);
}
function closeApp(then){ if(!current){ if(then) then(); return; } const win=$('#win'), id=current.id; setOrigin(win,current.from);
  win.classList.remove('opening'); win.classList.add('closing'); device.classList.remove('dim'); current=null; host.frame=null; host.app=null; bus.emit('app:close',id);
  setTimeout(()=>{ win.hidden=true; win.classList.remove('closing'); $('#winBody').innerHTML=''; renderHome(); if(then) then(); },280); }

/* Barre du bas : toucher = accueil, glisser vers le haut ou appui long = apps ouvertes */
function homeBar(el,onTap,onLong){ let y0=null, timer=0, fired=false;
  el.addEventListener('pointerdown',e=>{ y0=e.clientY; fired=false; clearTimeout(timer); timer=setTimeout(()=>{ fired=true; onLong(); },480); try{ el.setPointerCapture(e.pointerId); }catch(err){} });
  el.addEventListener('pointermove',e=>{ if(y0!=null&&Math.abs(e.clientY-y0)>8) clearTimeout(timer); });
  el.addEventListener('pointerup',e=>{ clearTimeout(timer); if(fired||y0==null){ y0=null; return; } const dy=y0-e.clientY; y0=null; if(dy>40) onLong(); else onTap(); });
  el.addEventListener('pointercancel',()=>{ clearTimeout(timer); y0=null; });
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onTap(); } }); }
homeBar($('#winZone'),()=>closeApp(),()=>closeApp(openSwitcher));
homeBar($('#homeZone'),openSwitcher,openSwitcher);

/* ---------- Hôte d'app (apps installées) ---------- */
function AppHost(body,a){
  const bar=h('div',{ class:'appbar' }, iconEl(a), h('b',{},a.nom), domBadge(a.domicile));
  const entree=a.domicile==='prive'? apps.privateEntry(a.id) : a.entree;
  if(entree&&/^apps\//.test(entree)){
    const fr=h('iframe',{ src:entree, title:a.nom, sandbox:'allow-scripts allow-forms allow-popups', referrerpolicy:'no-referrer' });
    body.append(h('div',{ class:'appframe' },bar,fr)); host.frame=fr; host.app=a; return;
  }
  const card=h('div',{ class:'extcard' }, iconEl(a), h('h2',{},a.nom), domBadge(a.domicile),
    h('p',{},a.description||(a.studio+' · version '+a.version)));
  if(entree){ card.append(h('a',{ class:'linkbtn', href:entree, target:'_blank', rel:'noopener noreferrer' },t('open')+' '+a.nom+' ↗'),
      h('p',{},a.domicile==='prive'? 'Adresse réglée sur cet appareil, jamais publiée.' : 'Cette app est hébergée '+(a.domicile==='service'?'sur un service':'publiquement')+' : elle s’ouvre dans un nouvel onglet.')); }
  else { const inp=h('input',{ id:'privUrl', type:'url', placeholder:'https://… ou http://ordinateur.local/…', autocomplete:'off' });
    card.append(h('p',{},'App privée : son adresse reste sur ton appareil. Indique où elle est installée (ordinateur ou cloud personnel).'),
      h('div',{ class:'fld', style:'width:100%' },h('label',{ for:'privUrl' },'Adresse de l’app sur cet appareil'),inp),
      h('button',{ class:'bluebtn', onclick:()=>{ if(apps.setPrivateEntry(a.id,inp.value.trim())){ island('Adresse enregistrée sur cet appareil'); body.innerHTML=''; AppHost(body,a); } else island('Adresse invalide : http ou https'); } },'Enregistrer l’adresse')); }
  body.append(h('div',{ class:'appframe' },bar,card));
}

/* ---------- Mode édition et glisser-déposer ---------- */
let editing=false, press=null, drag=null;
function setEditing(on){ editing=on; $('#home').classList.toggle('editing',on); $('#editDone').hidden=!on; if(on) island(t('editHint')); bus.emit('home:edit',on); }
$('#editDone').addEventListener('click',()=>setEditing(false));
const homeEl=$('#home');
homeEl.addEventListener('pointerdown',e=>{
  const tile=e.target.closest('.app'); if(!tile) return;
  if(editing){ startDrag(tile,e); return; }
  press={ tile, x:e.clientX, y:e.clientY, timer:setTimeout(()=>{ press=null; setEditing(true); startDrag(tile,e); },520) };
});
homeEl.addEventListener('pointermove',e=>{
  if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){ clearTimeout(press.timer); press=null; }
  if(!drag) return; const dr=device.getBoundingClientRect(); drag.ghost.style.left=(e.clientX-dr.left)+'px'; drag.ghost.style.top=(e.clientY-dr.top)+'px';
  const under=document.elementFromPoint(e.clientX,e.clientY), over=under&&under.closest('.app');
  document.querySelectorAll('.app.drop').forEach(x=>x.classList.remove('drop')); if(over&&over!==drag.tile) over.classList.add('drop'); drag.over=over&&over!==drag.tile? over : null;
});
function endPress(e){ if(press){ clearTimeout(press.timer); const tile=press.tile; press=null; if(e.type==='pointerup') openApp(tile.dataset.id,tile.querySelector('.icon')); }
  if(drag){ const { tile, over, ghost }=drag; ghost.remove(); tile.classList.remove('lifted'); document.querySelectorAll('.app.drop').forEach(x=>x.classList.remove('drop')); drag=null;
    if(over){ const l=layout.repair(), a={ id:tile.dataset.id, w:tile.dataset.where }, b={ id:over.dataset.id, w:over.dataset.where }; const ia=l[a.w].indexOf(a.id), ib=l[b.w].indexOf(b.id); if(ia>=0&&ib>=0){ l[a.w][ia]=b.id; l[b.w][ib]=a.id; layout.set(l); renderHome(); island(t('moved')); } } } }
homeEl.addEventListener('pointerup',endPress); homeEl.addEventListener('pointercancel',endPress);
function startDrag(tile,e){ const dr=device.getBoundingClientRect(); const ghost=tile.querySelector('.icon').cloneNode(true); ghost.classList.add('drag-ghost'); ghost.style.left=(e.clientX-dr.left)+'px'; ghost.style.top=(e.clientY-dr.top)+'px'; device.append(ghost); tile.classList.add('lifted'); drag={ tile, ghost, over:null }; }
homeEl.addEventListener('contextmenu',e=>e.preventDefault());
homeEl.addEventListener('keydown',e=>{ const tile=e.target.closest&&e.target.closest('.app'); if(tile&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openApp(tile.dataset.id,tile.querySelector('.icon')); } });

/* Glisser vers le bas : notifications (depuis le haut) ou recherche (depuis le milieu) */
(function pullDown(){ let s=null; homeEl.addEventListener('touchstart',e=>{ if(editing||e.touches.length!==1) return; const r=device.getBoundingClientRect(), y=e.touches[0].clientY-r.top; s={ y0:e.touches[0].clientY, x0:e.touches[0].clientX, top:y<64 }; },{ passive:true });
  homeEl.addEventListener('touchend',e=>{ if(!s) return; const tch=e.changedTouches[0], dy=tch.clientY-s.y0, dx=Math.abs(tch.clientX-s.x0); if(dy>70&&dx<50){ s.top? openCenter() : openSpot(); } s=null; },{ passive:true }); })();

function lockNow(){ closeSheets(); if(current){ $('#win').hidden=true; current=null; host.frame=null; host.app=null; $('#winBody').innerHTML=''; device.classList.remove('dim'); } setEditing(false); renderLock(); const l=$('#lock'); l.hidden=false; l.classList.remove('gone'); $('#home').hidden=true; bus.emit('lock'); }

(function lockSwipe(){ let y0=null; const l=$('#lock'); l.addEventListener('pointerdown',e=>{ y0=e.clientY; }); l.addEventListener('pointerup',e=>{ if(y0!=null&&y0-e.clientY>60) unlock(); y0=null; }); })();

/* Clavier */
addEventListener('keydown',e=>{
  if(!$('#dlg').hidden){ if(e.key==='Escape') $('#dlgNo').click(); return; }
  if(e.key==='Escape'){ if(!$('#switcher').hidden) closeSwitcher(); else if(!$('#spot').hidden) closeSpot(); else if(!$('#center').hidden) closeCenter(); else if(current) closeApp(); else if(editing) setEditing(false); return; }
  if(!$('#lock').hidden){ if(e.key==='Enter'||e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); unlock(); } return; }
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){ e.preventDefault(); openSpot(); }
  if((e.ctrlKey||e.altKey)&&e.key==='ArrowUp'){ e.preventDefault(); current? closeApp(openSwitcher) : openSwitcher(); }
});

        h('div',{ class:'act' }, st!=='publiée'? h('span',{ class:'dom' },'en audit') : inst.has(m.id)? h('button',{ class:'ghostbtn', onclick:()=>{ closeApp(()=>openApp(m.id)); } },t('open')) : h('button',{ class:'bluebtn', onclick:()=>{ apps.install(m,'ville'); island(m.nom+' installée'); draw(); } },t('install')))); }).filter(Boolean);

      h('div',{ class:'fld' },h('label',{ for:'fileName' },'Nom'),nom), h('div',{ class:'fld' },h('label',{ for:'fileBody' },'Contenu'),txt),
      f? h('p',{ class:'filemeta' },'Créé le '+new Date(f.cree).toLocaleString(loc())+' · modifié '+fmtAgo(f.modifie)+' · '+fmtSize(f.taille||0)) : null,
      h('div',{ class:'btnrow' }, h('button',{ class:'bluebtn', onclick:()=>{ const r=files.save({ id:f&&f.id, nom:nom.value, contenu:txt.value, app:'fichiers' }); island(r.ok? 'Enregistré' : r.error); if(r.ok) list(); } },'Enregistrer'),

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
function boot(){
  const fill=$('#bootFill'), log=$('#bootLog'), steps=[];
  const step=(txt,fn)=>steps.push([txt,fn]);
  step('Migrations du stockage',()=>{ migration=migrate(); cfg={ ...DEFAULTS, ...(storage.get('settings',{})||{}) }; });
  step('Réglages et langue',()=>{ applySettings(); });
  step('Registre des apps',()=>{ layout.set(layout.repair()); });
  step('Tests du noyau',()=>{ tests=runTests(); Aypona.tests=tests; });
  step('Écran d’accueil',()=>{ renderHome(); tick(); netState(); });
  step('Catalogue de la ville',()=>{ city.connect(); });
  const reduced=settings.get('reduceMotion')||matchMedia('(prefers-reduced-motion: reduce)').matches;
  let k=0; const next=()=>{ if(k>=steps.length){ finish(); return; } const [txt,fn]=steps[k]; log.textContent=txt+'…'; try{ fn(); }catch(e){ console.error(e); } k++; fill.style.width=(k/steps.length*100)+'%'; setTimeout(next,reduced?0:150); };
  const finish=()=>{ const n=(storage.get('boots',0)||0)+1; storage.set('boots',n);
    if(n===1) notify.add({ title:t('welcomeT'), body:t('welcomeP') }); else if(migration&&migration.from===1) notify.add({ title:t('updT'), body:t('updP') }); else notify.add({ title:t('rebootT'), body:t('rebootP',{ n }) });
    bus.emit('boot',{ version:VERSION, tests:tests.filter(x=>x.pass).length+'/'+tests.length });
    renderLock(); $('#lock').hidden=false; setTimeout(()=>{ $('#boot').classList.add('out'); setTimeout(()=>{ $('#boot').hidden=true; },460); },reduced?0:260); };
  setTimeout(next,reduced?0:450);
}
boot();
})();
